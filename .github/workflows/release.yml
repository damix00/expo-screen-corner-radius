name: Release

# Publishes to npm when a GitHub Release is published. Authenticates with npm Trusted
# Publishing (OIDC), so no NPM_TOKEN secret is needed, and npm attaches provenance
# automatically. One-time setup: on npmjs.com, add this repository and `release.yml`
# as a Trusted Publisher in the package settings.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run `npm publish --dry-run` instead of publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Required for Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm 11.5.1 or later, which ships with Node 24.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --ci

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && '--dry-run' || '' }}
