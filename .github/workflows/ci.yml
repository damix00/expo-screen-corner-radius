name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, build and test (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --ci

  swift:
    name: Unit tests (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  android:
    name: Unit tests (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm ci
        working-directory: example
      # The example's native project isn't committed, so generate it.
      - run: npx expo prebuild --platform android --no-install
        working-directory: example
      - run: ./gradlew :expo-screen-corner-radius:testDebugUnitTest
        working-directory: example/android
