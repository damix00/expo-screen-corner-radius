name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, build and test (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check the committed build output is up to date
        run: |
          if [ -n "$(git status --porcelain build)" ]; then
            git status --short build
            echo "::error::build/ is out of date. Run \`npm run build\` and commit the result."
            exit 1
          fi
      - run: npm test -- --ci
      - name: Check the npm package contents
        run: npm pack --dry-run

  swift:
    name: Unit tests (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test

  ios-build:
    name: Build the example app (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: example
      # Compiles the real module against ExpoModulesCore, which `swift test` can't.
      - run: npx expo prebuild --platform ios
        working-directory: example
      - name: Build for the simulator
        working-directory: example/ios
        run: |
          set -o pipefail
          # Prebuild names the project after the app, so look it up rather than hardcoding it.
          workspace="$(ls -d *.xcworkspace | head -n 1)"
          scheme="${workspace%.xcworkspace}"
          echo "Building $workspace (scheme $scheme)"
          xcodebuild build \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 50

  android:
    name: Unit tests (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm ci
        working-directory: example
      # The example's native project isn't committed, so generate it.
      - run: npx expo prebuild --platform android --no-install
        working-directory: example
      - run: ./gradlew :expo-screen-corner-radius:testDebugUnitTest
        working-directory: example/android
